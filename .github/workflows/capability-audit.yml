name: Capability audit gate

# 能力台账自动审计管线（P304W2-N01 / P304W2-N08 合并落地）。
# 四层门，全部机器可算：
#   1) 口径漂移门：spec 必须能由注册表重新生成（生成物 git diff 必须为空）；
#   2) 判据门（C6/C2）：pytest ≥15 且全绿；10 项五级均衡金标准语料一致率 ≥90%
#      （多数类基线 30%，增益 ≥60pp）；
#   3) 回归演练门（C3）：逐个把 REAL 能力注入造假实现，要求 gate 100% 检出；
#   4) 真台账门（C1/C4/C5 + 回归）：21 项覆盖 100%、证据链 100%、耗时 <60s，
#      与冻结基线对比任一等级下降（尤其 REAL→MOCK 反证）→ CI 红。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "50 3 * * *"   # 每晚随全量巡检复跑，抓"夜间代码改动导致的能力退化"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capability-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  # 冻结基线（版本化数据，不是构建产物）：回归防护的参照点。
  # 有意升级能力等级 → UPGRADE 放行；有意降级 → 必须提 ack 文件（见 docs/CAPABILITY_AUDIT_GATE.md §5）。
  BASELINE: config/capability_audit_gate/baseline.json
  SPEC: config/capability_audit_gate/spec.json
  GOLDEN_SPEC: config/capability_audit_gate/golden/spec.json
  GOLDEN_ROOT: config/capability_audit_gate/golden
  OUT: artifacts/capability_audit_gate

jobs:
  audit-gate:
    name: capability audit + regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install pytest

      - name: Spec drift gate (regenerate from registry, fail on diff)
        # spec 是"注册表 + 人审证据面"的派生物，手改 spec 而不改生成器 → 红。
        run: |
          python -m scripts.gen_capability_audit_spec
          git diff --exit-code -- config/capability_audit_gate/spec.json \
            || (echo "::error::capability spec drift: regenerate via scripts/gen_capability_audit_spec.py" && exit 1)

      - name: Baseline presence gate (regression reference must be versioned)
        run: |
          test -f "$BASELINE" \
            || (echo "::error::frozen baseline missing: $BASELINE" && exit 1)

      - name: "Unit + contract tests (rules / scan / gate / report / drill)"
        run: python -m pytest -q tests/capability_audit_gate

      - name: "C6: pytest test-count gate (>=15)"
        run: |
          n=$(python -m pytest --collect-only -q tests/capability_audit_gate 2>/dev/null \
                | grep -oE '^[0-9]+ tests collected' | grep -oE '^[0-9]+')
          echo "collected tests: $n"
          test "${n:-0}" -ge 15 || (echo "::error::capability audit suite has $n tests (<15)" && exit 1)

      - name: "C2: golden corpus agreement gate (>=90%, majority baseline 30%)"
        run: |
          python -m tools.capability_audit_gate.cli audit \
            --spec "$GOLDEN_SPEC" --root "$GOLDEN_ROOT" \
            --out "$OUT/golden" --enforce-acceptance

      - name: "C3: regression drill — every REAL capability tampered to MOCK must turn the gate red"
        # 注入只发生在临时副本；同时校验演练未写坏工作树（worktree_unchanged）。
        run: |
          python -m tools.capability_audit_gate.cli drill \
            --spec "$GOLDEN_SPEC" --root "$GOLDEN_ROOT" --out "$OUT/drill"
          python -m tools.capability_audit_gate.cli drill \
            --spec "$SPEC" --root . --out "$OUT/drill_real"

      - name: Real ledger audit + baseline regression gate
        # --fail-on-gate：等级下降（REAL→MOCK 等）→ 退出码 1 → CI 红；
        # --enforce-acceptance：覆盖 100% / 一致率 ≥90% / 证据链 100% / <60s 任一不达 → 退出码 3。
        run: |
          python -m tools.capability_audit_gate.cli audit \
            --spec "$SPEC" --root . \
            --out "$OUT" \
            --cache /tmp/cag_cache.json \
            --baseline "$BASELINE" \
            --contrast artifacts/capability_ledger/capability_ledger_resolved.json \
            --fail-on-gate --enforce-acceptance

      - name: Upload audit artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-audit-report
          path: |
            artifacts/capability_audit_gate/report.json
            artifacts/capability_audit_gate/report.md
            artifacts/capability_audit_gate/criteria.json
            artifacts/capability_audit_gate/gate.json
            artifacts/capability_audit_gate/drill/drill.json
            artifacts/capability_audit_gate/drill_real/drill.json
            artifacts/capability_audit_gate/golden/report.json
          if-no-files-found: warn
  # ── 证据自动化采集管线（P9263-N08）：执行型证据层 ────────────────────────────
  # 与上面 job 的分工：上面是**静态**审计（源码 AST + 基准工件），不执行代码；
  # 本 job 复核**执行型**证据快照（在线探针响应 / 绑定测试执行 / 参考误差复算）。
  # 在线服务在 CI 内不可达是**预期**：collect 只在部署侧跑（EVIDENCE_RUNTIME=1），
  # CI 只做三件事，且都是离线可复算的：
  #   1) 快照完整性：每份 acceptance.json 自摘要一致、等级可由存储信号重放（verify）；
  #   2) 判据：C1 覆盖 / C2 一致率 / C3 工件 / C4 回归门（无正面反证的降级 → 红）/ C5 零领域语义 / C6 CI 集成 / C7 pytest；
  #   3) 采集管线自身的 pytest 套件。
  evidence-collection:
    name: capability evidence collection (execution evidence layer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install pytest

      - name: "Pipeline self-tests (offline: stub HTTP server, no external service)"
        run: python -m pytest -q tests/evidence_collection

      - name: "Snapshot integrity: acceptance sha256 + level replay from stored signals"
        run: python -m tools.evidence_collection.cli verify

      - name: "Acceptance C1-C7 + regression gate (offline re-check of committed snapshot)"
        run: |
          python -m tools.evidence_collection.cli acceptance \
            --spec config/evidence_collection/spec.json \
            --summary artifacts/evidence_collection/summary.json \
            --baseline config/evidence_collection/baseline.json \
            --out artifacts/evidence_collection/acceptance_checks.json

      - name: Upload evidence collection artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-collection
          path: |
            artifacts/evidence_collection/summary.json
            artifacts/evidence_collection/acceptance_checks.json
            artifacts/evidence_collection/verify.json
          if-no-files-found: warn
