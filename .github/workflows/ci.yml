name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full backend sweep (03:30 UTC), in addition to push and PR checks.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the signal on the default branch stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contracts:
    name: contract tests
    # The shared research-run contract and the maturity gate use only the
    # standard library, so this gate needs no optional dependency and is
    # always reliable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install pytest
      - name: Run contract tests
        run: python -m pytest -q tests/

  research-factory:
    name: research factory checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "fastapi==0.104.1" "pydantic==2.5.0" pytest
      - name: Run research-factory tests
        run: PYTHONPATH=. pytest --noconftest -q tests/test_research_factory.py

  backend-suite:
    name: backend suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU torch (~200MB) — the backend code uses torch as a hard import
          # in api.distributed_api, services.ray_trainer and
          # services.llm_training_service.  The Dockerfile installs torch CPU
          # in production; do the same here so the import chain doesn't
          # crash with AttributeError on nn.Module annotations or
          # ModuleNotFoundError on `import torch`.
          pip install --no-cache-dir torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: Prepare sandbox for backend code paths
        # The backend still hardcodes several /app/... paths in api/*.py and
        # calls mkdir(exist_ok=True) at module import time.  In the CI runner
        # those paths are not writable, so the import chain (api/domain/*
        # -> api/datasets.py -> ...) crashes with PermissionError before any
        # test can run.  Provision a writable sandbox mirror of the production
        # layout that backend/Dockerfile{,.release} creates in-container.
        # This is a CI-only change; the production deploy still runs inside
        # its own container with the canonical /app tree.
        run: |
          sudo mkdir -p \
            /app/uploads/datasets \
            /app/uploads/algorithms \
            /app/uploads/backups \
            /app/uploads/llm \
            /app/uploads/models \
            /app/uploads/models/multimodal \
            /app/uploads/docker-bundles \
            /app/uploads/optuna.db \
            /app/saved_models/cv \
            /app/academy \
            /app/academy_readmes \
            /app/.keys
          sudo chown -R "$(id -u):$(id -g)" /app
      - name: Run backend tests
        run: PYTHONPATH=. pytest -q tests/ --timeout=600

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json
      - run: npm ci
      # Run the bundler even when the repository-wide legacy type-check has
      # unrelated errors.
      - run: npm run build
      - name: Type check (advisory)
        # The repository-wide vue-tsc pass still reports pre-existing errors
        # that are unrelated to any given change.  Report them without
        # failing the build; promote this to a gate once the backlog is
        # cleared.
        continue-on-error: true
        run: npm run type-check

  boundary-gates:
    name: boundary gates G1-G3 (baseline, non-blocking)
    # P2 migration campaign, audit report section 7: the ship-domain payload is
    # moving out of the TensorPlatform core surface.  These three gates make
    # "migration done" machine-checkable: G1 = no ship-domain imports in the
    # core surface (AST), G2 = no ship vocabulary in the live OpenAPI paths,
    # G3 = no hard-coded hydrodynamics constants in the core surface.
    #
    # The job runs in *baseline* mode on purpose: it records the violation
    # inventory instead of blocking the existing PR flow.  Promote it to a real
    # gate by appending --enforce to the script call below once the payload has
    # moved out.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --upgrade pip && pip install pytest
      - name: Gate logic unit tests (red and green fixtures)
        run: python -m pytest -q tests/test_boundary_gates.py
      - name: Boundary gate baseline snapshot
        # No API container runs in this job, so the G2 endpoint-vocabulary gate
        # reports WITHHELD; that is written into the JSON baseline rather than
        # silently dropped (and it turns red under --enforce, never green).
        continue-on-error: true
        run: |
          python tools/audit/boundary_gates.py \
            --json artifacts/boundary_gates/baseline.ci.json \
            --report docs/audit/boundary_gates_baseline.ci.md \
            --timeout 3
      - name: Upload baseline artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-gates-baseline
          path: |
            artifacts/boundary_gates/
            docs/audit/boundary_gates_baseline.ci.md
          if-no-files-found: warn
