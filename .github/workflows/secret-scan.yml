name: Secret Scan (three exits)

# Maturation of the secret-leak gate into the standard CI path:
# unit tests -> injection calibration (must be able to fail) -> three-exit
# self-injection -> self-scan of the scanner's own sources.

on:
  push:
    branches: [main, "agent/**"]
    paths:
      - "tools/secret_scan/**"
      - "data/secret_scan/**"
      - "tests/secret_scan/**"
      - ".github/workflows/secret-scan.yml"
  pull_request:
    paths:
      - "tools/secret_scan/**"
      - "data/secret_scan/**"
      - "tests/secret_scan/**"
      - ".github/workflows/secret-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Unit tests
        run: python -m pytest tests/secret_scan -q --no-header

      - name: Injection calibration (C1 / C2)
        run: python -m tools.secret_scan.cli calibrate --json artifacts/secret_scan/ci_calibration.json

      - name: Three-exit self-injection + self-scan
        run: python -m tools.secret_scan.cli ci

      - name: Diff-level gate on this change set
        run: python -m tools.secret_scan.cli gate-commit --repo . --all-changes --json artifacts/secret_scan/ci_verdict.json

      - name: Upload verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-evidence
          path: artifacts/secret_scan/
          if-no-files-found: ignore