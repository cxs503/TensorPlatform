[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = [".", ".."]
addopts = "-q --tb=short"
norecursedirs = ["__pycache__", ".venv", "node_modules", "frontend-vue"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
markers = [
    "slow: slow tests",
    "integration: integration tests",
    "capability: declare solver capability metadata consumed by tools/capability_discovery",
]
